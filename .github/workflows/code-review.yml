name: Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"               # 只在 Python 文件变更时触发
  push:
    branches: [main, master]  # 合入 main 后也跑一次（记录趋势）

# 并发控制：同一 PR 的多次 push 只跑最新一次
concurrency:
  group: cra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 整体超时

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要 git history 做 diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CRA
        run: pip install -e ".[dev]"

      - name: Configure LLM
        env:
          # 从 GitHub Secrets 读取 LLM API Key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 检测哪个 provider 可用
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "Using DeepSeek"
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "Using OpenAI"
          elif [ -n "$GEMINI_API_KEY" ]; then
            echo "Using Gemini"
          else
            echo "⚠️  No LLM API key set — evolution will be skipped"
          fi

      - name: Run Code Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_review.py

      # 进化产出的优化代码 → 上传为 artifact 供下载
      - name: Upload Evolved Code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolved-code
          path: "**/*.evolved.py"
          retention-days: 7
